<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail</title>
    <link rel="stylesheet" href="css/detail.css">
</head>
<body>
    <main class="container_main">
        <article class="container_img">
            <div class="container_button">
                <button class="button1">
                    <img  src="storage/img/img-15Back.svg">
                </button>
                <div class="button2">
                    <img src="storage/img/img-16Options.svg">
                </div>
            </div>
            <div class="container_summary">
                <div class="container_note">
                    <h3>Coldplay <span class="color">: Music of the Spheres</span></h3>
                    <div class="note1">
                        <img src="storage/img/img-19Location-gris.svg">
                        <p>Gelora Bung Karno Stadium, Jakarta</p>
                    </div>
                    <div class="note2">
                        <img src="storage/img/img-21Calender-gris.svg">
                        <p>November 15 2023</p>
                    </div>
                </div>
                <div class="container_log">
                    <div class="log_img">
                        <img class="log" src="storage/img/img-7Log1.svg">
                        <img class="log" src="storage/img/img-8Log2.svg">
                        <img class="log" src="storage/img/img-9Log3.svg">
                    </div>
                    <div class="log_text">
                        <h2>50K+ Participants</h2>  
                    </div>
                    
                </div>
            </div>
            <div>

            </div>
        </article>
    </main>
    
</body>
</html>
